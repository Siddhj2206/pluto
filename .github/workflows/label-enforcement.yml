name: enforce workflow labels

on:
  issues:
    types: [opened, edited, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  enforce:
    uses: projectbluefin/actions/.github/workflows/reusable-design-enforcement.yml@1ca03ea1f681c17fd104870aa154f8b5fd34e1d9 # v1
    secrets: inherit
    with:
      required-field-groups: '[["What happened?","What would you like to see?","What specifically should the agent focus on?"]]'

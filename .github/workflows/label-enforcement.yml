name: enforce workflow labels

on:
  issues:
    types: [opened, edited, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  enforce:
    uses: projectbluefin/actions/.github/workflows/reusable-design-enforcement.yml@9c699818ddf1043b8f5af8b862f59f783c6c7bda # v1
    secrets: inherit
    with:
      required-field-groups: '[["What happened?","What would you like to see?","What specifically should the agent focus on?"]]'

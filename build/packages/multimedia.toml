# multimedia — full codec set (negativo17). Consumed by 25-multimedia.sh:
# [multimedia_overrides] -> mesa/libva swaps from fedora-multimedia + versionlock
# [fedora]               -> one install --enablerepo=fedora-multimedia
# [vendor_assert]        -> must be negativo17.org vendor (assert_vendor)
#
# Repo kept enabled for runtime codec updates (bluefin disables and lints;
# pluto intentionally keeps enabled). Verified 2026-08-28:
# - ffmpeg/libavcodec/libfdk-aac are negativo17 only (Fedora has *-free)
# - gstreamer: -bad-free split -> unsplit bad (neg17 obsoletes), libav -> plugin-libav
# - intel-vpl-gpu-rt: in bluefin's 12 overrides but absent on f44 negativo
#   (repoquery f44 shows no such package — skip; --skip-unavailable would hide)

[multimedia_overrides]
packages = [
    "intel-mediasdk",
    "intel-gmmlib",
    "libheif",
    "libva",
    "libva-intel-media-driver",
    "mesa-dri-drivers",
    "mesa-filesystem",
    "mesa-libEGL",
    "mesa-libGL",
    "mesa-libgbm",
    "mesa-vulkan-drivers",
]

[fedora]
packages = [
    "ffmpeg",
    "ffmpeg-libs",
    "libavcodec",
    "libavdevice",
    "libavfilter",
    "libavformat",
    "libavutil",
    "libpostproc",
    "libswresample",
    "libswscale",
    "libfdk-aac",
    "gstreamer1-plugins-base",
    "gstreamer1-plugins-good",
    "gstreamer1-plugins-bad",
    "gstreamer1-plugins-ugly",
    "gstreamer1-plugin-libav",
    "lame",
    "lame-libs",
    "libjxl",
    "ffmpegthumbnailer",
    "pipewire-libs-extra", # negativo17 rebuild (bluefin vendor assert)
]

[vendor_assert]
packages = [
    "ffmpeg",
    "libavcodec",
    "libfdk-aac",
    "mesa-dri-drivers",
    "mesa-vulkan-drivers",
    "libheif",
    "libva",
    "pipewire-libs-extra",
    "x264-libs",
    "x265-libs",
]
